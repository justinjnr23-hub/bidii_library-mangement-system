 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reset password</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
 </head>
   <body class="min-h-screen bg-gray-200 text-gray-800 ">
    <main class="min-h-screen flex items-center justify-center">
        <div class="w-full max-w-sm">
            <!--the user reset section-->
        <section class="bg-gray-100 rounded-lg border border-gray-300 shadow-sm p-8">
          <h1 class="text-xl font-semibold">Reset password</h1>
       <!--paragraph-->
          <p class="text-sm text-gray-600 mt-1">Enter your email password and we will send you a reset link.</p>

          <!--form-->
          <form class="mt-6 space-y-4"> 
            <!--email div-->
           <div>
            <label for="email" class="block text-sm font-medium mb-1">Email</label>
            <input type="email" id="email" autocomplete="email" required class="w-full rounded-md border border-gray-300 bg-white">
           </div>
                  <!--button -->
                    <button
                        type="submit"
                        class="w-full bg-gray-800 text-white rounded-md py-2 hover:bg-gray-700 transition"
                    >
                       send Reset link
                    </button>


          </form>


        </section>
    


        </div>
      


    </main>
    
</body>
 </html>
